<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Notes Board</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>My Notes Board</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h2>Add a note</h2>
      <form id="note-form">
        <label for="note-title">Title</label>
        <input type="text" id="note-title" name="title" placeholder="Example: Buy a notebook" maxlength="60">

        <label for="note-text">Note</label>
        <textarea id="note-text" name="text" rows="4" placeholder="Write your note here" maxlength="300"></textarea>
        <p class="counter"><span id="char-count">0</span> / 300 characters</p>

        <button type="submit">Add note</button>
        <p id="form-message" class="message" role="status"></p>
      </form>
    </section>

    <section>
      <h2>All notes <span id="note-count" class="badge"></span></h2>
      <div id="notes-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Built in the Web Technology workshop at Mandsaur University.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
